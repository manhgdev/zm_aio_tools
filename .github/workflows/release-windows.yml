name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        shell: pwsh
        run: |
          npm install
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements-app.txt pyinstaller pywebview uv pythonnet pytest
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Write version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = if ($tag) { $tag -replace '^v', '' } else { Get-Content build_app/VERSION -ErrorAction SilentlyContinue }
          if (-not $version) { $version = '0.0.0' }
          Set-Content -Path build_app/VERSION -Value $version.Trim()
          Write-Host "Building version: $version"

      - name: Windows regression checks
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/backend"
          backend/.venv/Scripts/python.exe -m pytest `
            tests/backend/core/test_runtime_site.py `
            tests/backend/core/test_ai_runtime_setup.py `
            tests/backend/core/test_desktop_update.py `
            tests/backend/core/test_audit_regressions.py `
            tests/backend/core/test_cuda_dll_overlay.py `
            tests/backend/ocr/test_ocr_cuda_frozen_probe.py
          node --test --test-name-pattern="English catalog covers Configuration labels|English catalog has no empty entries" tests/i18n.catalog.test.mjs

      - name: Build EXE
        shell: pwsh
        run: npm run build:app


      - name: Create release package
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem build_app/release -Directory -Filter 'ZM_AIO_TOOL_v*' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'Không tìm thấy thư mục bản build.' }
          $exe = Join-Path $package.FullName 'ZM AIO TOOL.exe'
          if (-not (Test-Path $exe)) { throw "Không tìm thấy EXE: $exe" }
          $zip = Join-Path (Split-Path $package.FullName) "$($package.Name)-windows-x64.zip"
          if (-not (Test-Path $zip)) {
            Compress-Archive -Path "$($package.FullName)\*" -DestinationPath $zip -CompressionLevel Optimal
          }
          "directory=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        shell: pwsh
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP --clobber
          } else {
            gh release create $env:TAG $env:ZIP --generate-notes --title "ZM AIO TOOL $env:TAG"
          }
